name: CI

# Phase 0 (F-06 / R1): establishes the first CI workflow for this repository.
# There was no .github/workflows/ directory prior to this change.
#
# Runs the canonical test command (Vitest, via `npm test`) and the TypeScript
# type-check (`npm run type-check`) on every push and pull request.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test
