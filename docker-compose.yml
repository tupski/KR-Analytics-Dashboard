version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kr-dashboard
    ports:
      # L-3 Security: Bind ke localhost saja untuk security — hanya dapat diakses dari host machine.
      # Jika perlu diakses dari device/network lain (e.g. remote server), ganti ke "0.0.0.0:PORT:3000"
      # atau hapus prefix 127.0.0.1 dan pastikan firewall dikonfigurasi dengan benar.
      - "127.0.0.1:${DASHBOARD_PORT:-3031}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - ANALYTICS_DATABASE_URL=postgresql://${LOCAL_DB_USER:-analytics_user}:${LOCAL_DB_PASSWORD:-postgres}@postgres:5432/${LOCAL_DB_NAME:-analytics_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/app-settings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kr-analytics-net

  postgres:
    image: postgres:16-alpine
    container_name: kr-analytics-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-analytics_db}
      POSTGRES_USER: ${LOCAL_DB_USER:-analytics_user}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-analytics_user} -d ${LOCAL_DB_NAME:-analytics_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kr-analytics-net

  sync-worker:
    build:
      context: ./sync-worker
      dockerfile: Dockerfile
    container_name: kr-sync-worker
    volumes:
      # Run pending DB migrations (e.g. 008 sync_metadata.last_full_rescan_at)
      # before the worker starts — idempotent, tracked in schema_migrations.
      - ./db:/app/db:ro
    command: sh -c "node db/migrate.cjs && node dist/index.js"
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LOCAL_DB_HOST: postgres
      LOCAL_DB_PORT: "5432"
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-analytics_db}
      LOCAL_DB_USER: ${LOCAL_DB_USER:-analytics_user}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-300000}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-500}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-365}
      SYNC_RECENT_WINDOW_DAYS: ${SYNC_RECENT_WINDOW_DAYS:-14}
      FULL_RESCAN_INTERVAL_MS: ${FULL_RESCAN_INTERVAL_MS:-86400000}
      NODE_ENV: production
      TZ: Asia/Jakarta
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNC_WORKER_PORT:-3032}:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kr-analytics-net

volumes:
  postgres_data:
    driver: local

networks:
  kr-analytics-net:
    driver: bridge
