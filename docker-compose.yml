version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kr-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-kr_analytics}
      POSTGRES_USER: ${LOCAL_DB_USER:-analytics}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-analytics_dev_password}
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-analytics} -d ${LOCAL_DB_NAME:-kr_analytics}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kr-analytics-net

  sync-worker:
    build:
      context: ./sync-worker
      dockerfile: Dockerfile
    container_name: kr-sync-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LOCAL_DB_HOST: postgres
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-kr_analytics}
      LOCAL_DB_USER: ${LOCAL_DB_USER:-analytics}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-analytics_dev_password}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-300000}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-1000}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-30}
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kr-analytics-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kr-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3031}:3031"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LOCAL_DB_HOST: postgres
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-kr_analytics}
      LOCAL_DB_USER: ${LOCAL_DB_USER:-analytics}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-analytics_dev_password}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3031}
      TZ: Asia/Jakarta
    networks:
      - kr-analytics-net

volumes:
  postgres_data:
    driver: local

networks:
  kr-analytics-net:
    driver: bridge
